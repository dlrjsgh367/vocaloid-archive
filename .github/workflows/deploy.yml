name: Deploy to OCI

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy
    runs-on: [self-hosted, oci-arm]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env file
        env:
          APP_DB_USER: ${{ secrets.APP_DB_USER }}
          APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          APP_CORS_ORIGINS: ${{ secrets.APP_CORS_ORIGINS }}
        run: |
          printf 'APP_DB_USER=%s\nAPP_DB_PASSWORD=%s\nJWT_SECRET=%s\nAPP_CORS_ORIGINS=%s\n' \
            "$APP_DB_USER" "$APP_DB_PASSWORD" "$JWT_SECRET" "$APP_CORS_ORIGINS" > .env

      - name: Build & Deploy
        run: |
          docker compose -f docker-compose.prod.yml up -d --build

      - name: Health Check
        run: |
          echo "Waiting for backend to start..."
          sleep 10
          for i in $(seq 1 6); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost/api/health)
            if [ "$STATUS" = "200" ]; then
              echo "Health check passed (HTTP $STATUS)"
              exit 0
            fi
            echo "Attempt $i: HTTP $STATUS, retrying in 10s..."
            sleep 10
          done
          echo "Health check failed after 60s"
          exit 1

      - name: Cleanup old images
        if: success()
        run: docker image prune -f
