services:
  backend:
    build:
      context: ./backend
    image: vocaloid-archive-backend
    container_name: vocaloid-backend
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:mysql://172.17.0.1:3306/vocaloid_archive?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
      SPRING_DATASOURCE_USERNAME: ${APP_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${APP_DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_CORS_ORIGINS: ${APP_CORS_ORIGINS}
      RENDERER_BASE_URL: http://renderer:3000
      CARD_CACHE_DIR: /var/cache/cards
    volumes:
      - card-cache:/var/cache/cards
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - renderer

  renderer:
    build:
      context: ./renderer
    image: vocaloid-archive-renderer
    container_name: vocaloid-renderer
    restart: unless-stopped
    expose:
      - "3000"

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api
    image: vocaloid-archive-web
    container_name: vocaloid-web
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - certbot-etc:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    depends_on:
      - backend

  certbot:
    image: certbot/certbot
    container_name: vocaloid-certbot
    restart: unless-stopped
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    entrypoint: /bin/sh
    command: -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done"

volumes:
  card-cache:
  certbot-etc:
  certbot-www:
