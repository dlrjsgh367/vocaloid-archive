spring:
  application:
    name: vocaloid-archive
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.dialect: org.hibernate.dialect.MySQL8Dialect
      hibernate.format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true

server:
  port: 8080

app:
  jwt:
    # 기본값은 Base64 인코딩된 placeholder ("please-change-me-vocaloid-archive-256bit-development-default-only").
    # 운영에서는 반드시 JWT_SECRET 환경변수로 256비트 이상 무작위 값을 주입할 것.
    secret: ${JWT_SECRET:cGxlYXNlLWNoYW5nZS1tZS12b2NhbG9pZC1hcmNoaXZlLTI1NmJpdC1kZXZlbG9wbWVudC1kZWZhdWx0LW9ubHk=}
    access-token-expiry-minutes: 30
    refresh-token-expiry-days: 14
  cors:
    origins: ${APP_CORS_ORIGINS:http://localhost:5173}

logging:
  level:
    # INFO is the safe default for docker/prod. Verbose app logging is enabled only in the
    # local profile (application-local.yml) to keep production logs free of internal detail.
    com.vocaloidarchive: INFO
