plugins {
  id 'java'
  id 'org.springframework.boot' version '3.2.5'
  id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.vocaloidarchive'
version = '0.0.1-SNAPSHOT'

java {
  sourceCompatibility = '17'
}

repositories {
  mavenCentral()
}

dependencies {
  implementation 'org.springframework.boot:spring-boot-starter-web'
  implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
  implementation 'org.springframework.boot:spring-boot-starter-security'
  implementation 'org.springframework.boot:spring-boot-starter-validation'

  implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
  annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
  annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
  annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

  implementation 'io.jsonwebtoken:jjwt-api:0.12.5'
  runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.5'
  runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.5'

  implementation 'org.flywaydb:flyway-core'
  implementation 'org.flywaydb:flyway-mysql'

  runtimeOnly 'com.mysql:mysql-connector-j'

  compileOnly 'org.projectlombok:lombok'
  annotationProcessor 'org.projectlombok:lombok'

  testImplementation 'org.springframework.boot:spring-boot-starter-test'
  testImplementation 'org.springframework.boot:spring-boot-testcontainers'
  testImplementation 'org.springframework.security:spring-security-test'
  testImplementation 'org.testcontainers:junit-jupiter:1.19.7'
  testImplementation 'org.testcontainers:mysql:1.19.7'
}

tasks.named('test') {
  useJUnitPlatform()
  // Testcontainers' bundled docker-java negotiates Docker API v1.32, which modern Docker
  // Engines (>= 25, min API 1.40) reject. Pin a compatible version; override via env if needed.
  def dockerApi = System.getenv('DOCKER_API_VERSION') ?: '1.43'
  environment 'DOCKER_API_VERSION', dockerApi
  systemProperty 'api.version', dockerApi
}

// QueryDSL Q-class generation
def querydslDir = layout.buildDirectory.dir('generated/querydsl').get().asFile
sourceSets {
  main {
    java {
      srcDirs += querydslDir
    }
  }
}
tasks.withType(JavaCompile).configureEach {
  options.generatedSourceOutputDirectory = querydslDir
}
clean {
  delete querydslDir
}
