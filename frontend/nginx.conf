server {
    listen 80;
    server_name _;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Vite가 생성하는 hashed asset은 영구 캐시
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 공유 링크: SNS 크롤러봇이면 Spring OG SSR로, 사람이면 SPA로
    location /p/ {
        if ($http_user_agent ~* "(Twitterbot|facebookexternalhit|kakaotalk-scrap|Slackbot|Discordbot|TelegramBot|LinkedInBot|WhatsApp|Pinterest|redditbot|Applebot|Googlebot)") {
            rewrite ^/p/(.*)$ /share/p/$1 last;
        }
        root /usr/share/nginx/html;
        try_files $uri /index.html;
    }

    # 크롤러용 OG SSR (백엔드)
    location /share/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback (vue-router history 모드 대응)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Spring Boot API proxy
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 10m;
    }
}
